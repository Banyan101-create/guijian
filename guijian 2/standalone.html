<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>古建生成器 Chinese Architecture Generator</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#0e0e10; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #wrap { position:relative; width:100vw; height:100vh; }
  #panel { position:absolute; top:12px; left:12px; width:252px; background:rgba(16,16,18,0.88);
    color:#e8e6e1; padding:14px 16px; border-radius:12px; font-size:12.5px; backdrop-filter:blur(10px);
    max-height:94vh; overflow-y:auto; border:1px solid rgba(255,255,255,0.08); }
  #panel h3 { margin:0 0 10px; font-size:12px; font-weight:500; color:#d9b779; letter-spacing:0.04em; text-transform:uppercase; }
  #panel .sec { margin:14px 0 6px; font-size:11px; color:#8a877f; letter-spacing:0.05em; text-transform:uppercase; }
  .row { margin:7px 0; }
  .row label { display:flex; justify-content:space-between; margin-bottom:3px; color:#b8b5ad; font-size:12px; }
  .row label span { color:#d9b779; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:#b3542f; }
  input[type=color] { width:100%; height:22px; border:none; border-radius:4px; background:none; cursor:pointer; }
  select { width:100%; padding:5px 6px; border-radius:6px; background:#232326; color:#e8e6e1; border:1px solid #3a3a3e; font-size:12px; }
  button { width:100%; margin-top:12px; padding:9px; background:#b3542f; color:#fff; border:none;
    border-radius:7px; cursor:pointer; font-size:12.5px; font-weight:500; }
  button:hover { background:#c9633a; }
  #hint { position:absolute; bottom:12px; left:14px; color:#6a6862; font-size:11px; }
  #stats { position:absolute; bottom:12px; right:14px; color:#6a6862; font-size:11px; font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<div id="wrap">
  <div id="panel">
    <h3>古建生成器</h3>

    <div class="sec">建筑类型 building</div>
    <div class="row"><label>类型 type</label>
      <select id="buildingType">
        <option value="hall">大殿 hall</option>
        <option value="pagoda">高塔 pagoda</option>
      </select>
    </div>
    <div class="row pg"><label>塔式 style</label>
      <select id="pagodaStyle">
        <option value="louge">楼阁式 pavilion</option>
        <option value="miyan">密檐式 dense-eave</option>
      </select>
    </div>
    <div class="row pg"><label>层数 storeys <span id="stOut"></span></label><input type="range" id="storeys" min="3" max="13" step="2" value="7"></div>
    <div class="row pg"><label>平面边数 plan sides <span id="sdOut"></span></label><input type="range" id="sides" min="4" max="8" step="2" value="8"></div>

    <div class="sec">模数 module 斗口</div>
    <div class="row"><label>斗口等级 grade <span id="dkOut"></span></label><input type="range" id="doukou" min="1" max="11" step="1" value="6"></div>
    <div class="row"><label>做法 class</label>
      <select id="classType">
        <option value="da">大式 grand (bracketed)</option>
        <option value="xiao">小式 minor (no brackets)</option>
      </select>
    </div>
    <div class="row"><label>年代 period</label>
      <select id="period">
        <option value="qing">清 Qing 工程做法则例</option>
        <option value="song">宋 Song 营造法式</option>
      </select>
    </div>

    <div class="sec">开间进深 plan</div>
    <div class="row"><label>面阔间数 bays <span id="bayOut"></span></label><input type="range" id="bays" min="3" max="11" step="2" value="5"></div>
    <div class="row"><label>檩数 purlins <span id="plOut"></span></label><input type="range" id="purlins" min="5" max="11" step="2" value="9"></div>

    <div class="sec">屋顶 roof</div>
    <div class="row"><label>式样 type</label>
      <select id="roofType">
        <option value="xieshan">歇山顶 hip-and-gable</option>
        <option value="wudian">庑殿顶 hip roof</option>
      </select>
    </div>
    <div class="row"><label>推山 tuishan <span id="tsOut"></span></label><input type="range" id="tuishan" min="0" max="1" step="1" value="1"></div>
    <div class="row"><label>瓦垄 tile ribs <span id="tOut"></span></label><input type="range" id="tiles" min="0" max="60" step="2" value="26"></div>

    <div class="sec">做法细则 rules</div>
    <div class="row"><label>生起 shengqi <span id="sqOut"></span></label><input type="range" id="shengqi" min="0" max="1" step="1" value="1"></div>
    <div class="row"><label>侧脚 cejiao <span id="cjOut"></span></label><input type="range" id="cejiao" min="0" max="1" step="1" value="1"></div>
    <div class="row"><label>栏杆 balustrade <span id="rlOut"></span></label><input type="range" id="railing" min="0" max="1" step="1" value="1"></div>
    <div class="row"><label>彩画 caihua <span id="chOut"></span></label><input type="range" id="caihua" min="0" max="1" step="1" value="1"></div>

    <div class="sec">推算尺寸 derived</div>
    <div id="derived" style="font-size:11px;line-height:1.65;color:#8f8c84;font-variant-numeric:tabular-nums;"></div>

    <div class="sec">颜色 palette</div>
    <div class="row"><label>预设 preset</label>
      <select id="preset">
        <option value="imperial" selected>皇家 imperial · 黄琉璃</option>
        <option value="official">官式 official · 绿琉璃</option>
        <option value="heaven">天坛 heaven · 蓝琉璃</option>
        <option value="library">文渊 library · 黑琉璃</option>
        <option value="temple">寺观 temple · 灰瓦</option>
        <option value="jiangnan">江南 Jiangnan · 粉墙黛瓦</option>
        <option value="lingnan">岭南 Lingnan · southern</option>
        <option value="tibetan">藏式 Tibetan · crimson + gold</option>
      </select>
    </div>
    <div class="row"><label>瓦 tile</label><input type="color" id="roofColor" value="#b8912a"></div>
    <div class="row"><label>脊/檐口 ridge + eave trim</label><input type="color" id="trimColor" value="#d8d2c2"></div>
    <div class="row"><label>柱 columns</label><input type="color" id="woodColor" value="#8a2a1c"></div>
    <div class="row"><label>枋/椽 beams + rafters</label><input type="color" id="beamColor" value="#1d4a66"></div>
    <div class="row"><label>彩画 painted detail</label><input type="color" id="caihuaColor" value="#2f7d8a"></div>
    <div class="row"><label>斗拱 brackets</label><input type="color" id="dgColor" value="#28647a"></div>
    <div class="row"><label>墙 wall</label><input type="color" id="wallColor" value="#9e2f20"></div>
    <div class="row"><label>槅扇 lattice</label><input type="color" id="latticeColor" value="#7a2418"></div>
    <div class="row"><label>基座 base stone</label><input type="color" id="baseColor" value="#c9c3b2"></div>
    <div class="row"><label>栏杆 balustrade</label><input type="color" id="railColor" value="#d8d2c2"></div>

    <button id="exportBtn">导出 OBJ export</button>
    <button id="imgBtn" style="background:#3f6b4a;">保存图片 save JPEG</button>
    <div style="display:flex;gap:6px;margin-top:8px;">
      <button id="saveBtn" style="margin-top:0;background:#2a4a66;">保存 save</button>
      <button id="loadBtn" style="margin-top:0;background:#4a4a52;">读取 load</button>
    </div>
  </div>
  <div id="hint">drag rotate · scroll zoom · right-drag pan</div>
  <div id="stats"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1d22);
scene.fog = new THREE.Fog(0x1b1d22, 45, 100);

var camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(12, 8, 13);

var renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.getElementById('wrap').appendChild(renderer.domElement);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 2.2, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 3.5;
controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI * 0.495;

// procedural sky-ish environment for PBR reflections
function makeEnvMap() {
  var c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  var ctx = c.getContext('2d');
  var g = ctx.createLinearGradient(0, 0, 0, 256);
  g.addColorStop(0.0, '#c2c9d0');
  g.addColorStop(0.45, '#e2e0da');
  g.addColorStop(0.55, '#8e8a80');
  g.addColorStop(1.0, '#3b3a36');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 512, 256);
  var tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  var pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  var env = pmrem.fromEquirectangular(tex).texture;
  pmrem.dispose(); tex.dispose();
  return env;
}
scene.environment = makeEnvMap();

var hemi = new THREE.HemisphereLight(0xdfe3e6, 0x59493a, 0.55);
scene.add(hemi);
var sun = new THREE.DirectionalLight(0xfff4e6, 2.0);
sun.position.set(9, 14, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -16; sun.shadow.camera.right = 16;
sun.shadow.camera.top = 16; sun.shadow.camera.bottom = -16;
sun.shadow.camera.far = 50;
sun.shadow.bias = -0.0009;
scene.add(sun);
var rim = new THREE.DirectionalLight(0xa8b4c4, 0.16);
rim.position.set(-9, 5, -8);
scene.add(rim);

var ground = new THREE.Mesh(
  new THREE.PlaneGeometry(120, 120),
  new THREE.MeshStandardMaterial({ color:C('#2c2b26'), roughness:0.97, metalness:0 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);


// ============================================================================
//  PROCEDURAL TEXTURES — drawn greyscale so the material colour tints them,
//  keeping every colour picker functional while adding real surface detail.
// ============================================================================
var TEX = {};
var MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

function makeCanvas(w, h, draw) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  var t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;          // stone read at a grazing angle needs all of it
  t.encoding = THREE.sRGBEncoding;
  return t;
}

// Each albedo above is drawn as a height field as well as a colour, so a Sobel
// pass turns it into a matching normal map. This is what makes a joint read as
// a recess instead of a printed line. Wraps at the edges so the normal map
// tiles exactly like the albedo it came from.
function normalFromHeight(tex, strength) {
  var src = tex.image, w = src.width, h = src.height;
  var d = src.getContext('2d').getImageData(0, 0, w, h).data;
  var out = document.createElement('canvas');
  out.width = w; out.height = h;
  var octx = out.getContext('2d');
  var img = octx.createImageData(w, h);
  function H(x, y) { return d[((((y % h) + h) % h) * w + (((x % w) + w) % w)) * 4] / 255; }
  for (var y = 0; y < h; y++) {
    for (var x = 0; x < w; x++) {
      var dx = (H(x-1,y-1) + 2*H(x-1,y) + H(x-1,y+1)
              - H(x+1,y-1) - 2*H(x+1,y) - H(x+1,y+1)) * strength;
      var dy = (H(x-1,y+1) + 2*H(x,y+1) + H(x+1,y+1)
              - H(x-1,y-1) - 2*H(x,y-1) - H(x+1,y-1)) * strength;
      var len = Math.sqrt(dx*dx + dy*dy + 1);
      var i = (y * w + x) * 4;
      img.data[i]     = (dx / len * 0.5 + 0.5) * 255;
      img.data[i + 1] = (dy / len * 0.5 + 0.5) * 255;
      img.data[i + 2] = (1  / len * 0.5 + 0.5) * 255;
      img.data[i + 3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
  var t = new THREE.CanvasTexture(out);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;
  // a normal map carries vectors, not colour -- it must stay linear
  return t;
}

// ----------------------------------------------------------------------------
//  BoxGeometry gives every face UVs of 0..1 whatever its real size, so a 9-unit
//  platform tier and a 0.24-unit step tread would show the same number of
//  bricks: courses smear on the big faces, go chunky on the small ones, and
//  never line up between neighbouring parts. Rewriting the UVs in world units
//  gives one texel density across the whole building; each material's
//  map.repeat then means "tiles per world unit".
// ----------------------------------------------------------------------------
function worldScaleUVs(root) {
  root.traverse(function (o) {
    if (!o.isMesh) return;
    var geo = o.geometry, p = geo.parameters;
    if (!p || geo.userData.uvScaled) return;
    var uv = geo.attributes.uv;
    if (!uv) return;
    var mats = Array.isArray(o.material) ? o.material : [o.material];
    if (!mats.some(function (m) { return m && (m.map || m.normalMap); })) return;

    if (p.depth !== undefined && p.width !== undefined && uv.count === 24) {
      // BoxGeometry face order is +X -X +Y -Y +Z -Z, four verts each
      var f = [[p.depth, p.height], [p.depth, p.height],
               [p.width, p.depth],  [p.width, p.depth],
               [p.width, p.height], [p.width, p.height]];
      for (var i = 0; i < 6; i++) {
        for (var v = 0; v < 4; v++) {
          var k = i * 4 + v;
          uv.setXY(k, uv.getX(k) * f[i][0], uv.getY(k) * f[i][1]);
        }
      }
    } else if (p.radiusTop !== undefined) {
      // Cylinder u wraps the circumference: round it to whole tiles or the
      // grain tears open at the seam.
      var circ = Math.max(1, Math.round(Math.PI * (p.radiusTop + p.radiusBottom)));
      for (var q = 0; q < uv.count; q++)
        uv.setXY(q, uv.getX(q) * circ, uv.getY(q) * p.height);
    } else return;

    uv.needsUpdate = true;
    geo.userData.uvScaled = true;
  });
}

function initTextures() {
  // 筒瓦 barrel tiles: vertical half-round columns with row shadows
  TEX.tile = makeCanvas(512, 512, function(ctx, w, h) {
    var cols = 8, rows = 6, cw = w/cols, rh = h/rows;
    for (var x = 0; x < w; x++) {
      var ph = (x / cw) * Math.PI * 2;
      var shade = 178 + 77 * Math.pow(0.5 + 0.5*Math.cos(ph), 0.55);
      ctx.fillStyle = 'rgb(' + [shade,shade,shade].join(',') + ')';
      ctx.fillRect(x, 0, 1, h);
    }
    for (var r = 0; r < rows; r++) {
      // each course laps the one below: a hard shadow line, then a short ramp
      var y = r * rh;
      var lap = ctx.createLinearGradient(0, y, 0, y + rh*0.22);
      lap.addColorStop(0.0, 'rgba(30,30,30,0.55)');
      lap.addColorStop(1.0, 'rgba(30,30,30,0.0)');
      ctx.fillStyle = lap;
      ctx.fillRect(0, y, w, rh*0.22);
      // the rounded end of each barrel where it laps the course below: a soft
      // highlight on the crown, a crescent of shade under it
      for (var c2 = 0; c2 < cols; c2++) {
        var cx = c2*cw + cw/2, cy = y + rh*0.10, cr = cw*0.27;
        var dome = ctx.createRadialGradient(cx, cy - cr*0.35, cr*0.1, cx, cy, cr);
        dome.addColorStop(0.0, 'rgba(255,255,255,0.42)');
        dome.addColorStop(0.7, 'rgba(255,255,255,0.10)');
        dome.addColorStop(1.0, 'rgba(255,255,255,0.0)');
        ctx.fillStyle = dome;
        ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(60,60,60,0.28)'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(cx, cy, cr, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke();
      }
    }
  });

  // wood grain: long vertical streaks with knots
  TEX.wood = makeCanvas(128, 512, function(ctx, w, h) {
    ctx.fillStyle = 'rgb(238,238,238)';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 60; i++) {
      var x = Math.random()*w, wd = 1 + Math.random()*2.5;
      var sh = 198 + Math.random()*46;
      ctx.strokeStyle = 'rgba(' + [sh,sh,sh].join(',') + ',0.55)';
      ctx.lineWidth = wd;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.bezierCurveTo(x + (Math.random()-0.5)*14, h*0.33,
                        x + (Math.random()-0.5)*14, h*0.66, x, h);
      ctx.stroke();
    }
  });

  // plaster: soft noise
  TEX.plaster = makeCanvas(256, 256, function(ctx, w, h) {
    ctx.fillStyle = 'rgb(242,242,242)';
    ctx.fillRect(0, 0, w, h);
    for (var i = 0; i < 4200; i++) {
      var sh = 214 + Math.random()*40;
      ctx.fillStyle = 'rgba(' + [sh,sh,sh].join(',') + ',0.25)';
      ctx.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*2, 1+Math.random()*2);
    }
  });

  // 条石 dressed ashlar: solid blocks standing proud of a recessed joint, each
  // with a chamfered arris. Drawn as blocks rather than as lines on a flat
  // ground so normalFromHeight() has a real step to work from -- lines alone
  // give you painted-on joints that vanish under any light.
  TEX.stone = makeCanvas(512, 512, function(ctx, w, h) {
    var rows = 6, cols = 3, bh = h/rows, bw = w/cols, joint = 6;

    // block tones are indexed by column so the pair straddling the tile seam
    // gets one colour instead of two
    var tone = [];
    for (var r0 = 0; r0 < rows; r0++) {
      tone[r0] = [];
      for (var c0 = 0; c0 < cols; c0++) tone[r0][c0] = 222 + Math.random()*26;
    }

    ctx.fillStyle = 'rgb(132,132,132)';         // the recessed joint itself
    ctx.fillRect(0, 0, w, h);

    for (var r = 0; r < rows; r++) {
      var off = (r % 2) * bw/2;
      for (var b = -1; b <= cols; b++) {
        var x = off + b*bw, y = r*bh;
        var t = tone[r][((b % cols) + cols) % cols];
        var fx = x + joint/2, fy = y + joint/2, fw = bw - joint, fh = bh - joint;

        ctx.fillStyle = 'rgb(' + [t,t,t].join(',') + ')';
        ctx.fillRect(fx, fy, fw, fh);

        // 3 px chamfer: lit on the top and left arris, shaded on the other two
        ctx.fillStyle = 'rgba(255,255,255,0.50)';
        ctx.fillRect(fx, fy, fw, 3);
        ctx.fillRect(fx, fy, 3, fh);
        ctx.fillStyle = 'rgba(58,58,58,0.38)';
        ctx.fillRect(fx, fy + fh - 3, fw, 3);
        ctx.fillRect(fx + fw - 3, fy, 3, fh);

        // tooled face: fine chisel speckle
        for (var i = 0; i < 320; i++) {
          var sh = t - 14 + Math.random()*28;
          ctx.fillStyle = 'rgba(' + [sh,sh,sh].join(',') + ',0.30)';
          ctx.fillRect(fx + Math.random()*fw, fy + Math.random()*fh, 2, 2);
        }
      }
    }
  });

  TEX.tileN    = normalFromHeight(TEX.tile,    2.2);
  TEX.woodN    = normalFromHeight(TEX.wood,    1.2);
  TEX.plasterN = normalFromHeight(TEX.plaster, 1.0);
  TEX.stoneN   = normalFromHeight(TEX.stone,   3.0);
}

// Hex colours are sRGB. With outputEncoding = sRGB the renderer converts
// linear -> sRGB on output, so feeding sRGB in unconverted brightens everything
// twice -- deep red renders as salmon. Convert on the way in.
function C(hex) { return new THREE.Color(hex).convertSRGBToLinear(); }

function texClone(t, rx, ry) {
  var c = t.clone();
  c.needsUpdate = true;
  c.repeat.set(rx, ry);
  return c;
}

initTextures();

var buildingGroup = new THREE.Group();
scene.add(buildingGroup);

// ============================================================================
//  MODULAR PROPORTION SYSTEM
//  Every dimension below derives from one module, per 《工程做法则例》(Qing,
//  1734) and 《营造法式》(Song, 1103). No invented constants.
// ============================================================================

// 斗口 grades 1..11 : 6.0寸 down to 1.0寸 in 0.5寸 steps (卷二十八)
var DOUKOU_CUN = [6.0, 5.5, 5.0, 4.5, 4.0, 3.5, 3.0, 2.5, 2.0, 1.5, 1.0];

// 举架 coefficient ladders, eave -> ridge, keyed by purlin count (Qing)
var JUJIA = {
  5:  [0.5, 0.7],
  7:  [0.5, 0.65, 0.8],
  9:  [0.5, 0.65, 0.75, 0.9],
  11: [0.5, 0.6, 0.65, 0.75, 0.9]
};

// Song 举折: total rise as a fraction of span, by building class
var JUZHE_RISE = { dian: 1/3, ting: 1/4 };

function deriveDimensions(grade, bays, purlins, isDaShi, isSong) {
  var dk = 1.0;                       // work in doukou units, scale at the end
  var D = {};
  D.doukouCun = DOUKOU_CUN[grade - 1];

  // --- vertical: column ---
  D.colDia    = 6 * dk;               // 檐柱径 = 6 斗口
  D.colH      = 60 * dk;              // 檐柱高 = 60 斗口 (= 10 diameters)
  D.colTopDia = D.colDia * (1 - (isDaShi ? 0.007 : 0.01) * 10); // 收分 taper
  D.cejiao    = { front: 1/100, side: 8/1000 };                 // 侧脚 lean

  // --- plan: bays. 明间 = 77 斗口 (7 攒 x 11), each outward bay -1 攒 ---
  D.zanDang = 11 * dk;
  var half = (bays - 1) / 2;
  D.bayWidths = [];
  for (var i = -half; i <= half; i++) {
    var steps = Math.abs(i);
    var w = 77 * dk - steps * D.zanDang;
    D.bayWidths.push(Math.max(44 * dk, w));   // floor at 4 攒
  }
  D.totalWidth = D.bayWidths.reduce(function(a,b){ return a+b; }, 0);

  // --- plan: depth. 通进深 = 通面阔 x 5/8 (documented 大式 rule), then
  // subdivided into 步架 keeping the canonical 廊步:其他 = 24:19.2 = 1.25:1 ratio ---
  D.totalDepth = D.totalWidth * 0.625;
  D.halfDepth  = D.totalDepth / 2;
  var halfSteps = (purlins - 1) / 2;
  var weights = [];
  for (var k = 0; k < halfSteps; k++) weights.push(k === 0 ? 1.25 : 1.0);
  var wSum = weights.reduce(function(a,b){ return a+b; }, 0);
  D.stepRuns = weights.map(function(w){ return (w / wSum) * D.halfDepth; });

  // --- roof curve: real purlin positions from 举架 / 举折 ---
  D.coeffs = JUJIA[purlins] || JUJIA[9];
  D.purlins = [{ x: D.halfDepth, y: 0 }];       // eave purlin at the outside
  var cx = D.halfDepth, cy = 0;
  for (var j = 0; j < D.stepRuns.length; j++) {
    cx -= D.stepRuns[j];
    cy += D.coeffs[j] * D.stepRuns[j];
    D.purlins.push({ x: Math.max(0, cx), y: cy });
  }
  D.pingShui = isDaShi ? 4 * dk : D.colDia - 1;   // 平水 above the melon column
  D.roofRise = cy + D.pingShui;
  D.purlins[D.purlins.length - 1].y += D.pingShui;

  if (isSong) {
    // 举折: fix total rise as a fraction of span, then fold top-down by halves
    var H = D.totalDepth * JUZHE_RISE.dian;
    var n = D.purlins.length;
    for (var q = 0; q < n; q++) {
      var t = q / (n - 1);                        // 0 = eave, 1 = ridge
      D.purlins[q].y = H * t;
    }
    var fold = H / 10;
    for (var f = n - 2; f > 0; f--) {
      D.purlins[f].y -= fold;
      fold /= 2;
    }
    D.roofRise = H;
  }

  // --- eave: 出檐 = 21 斗口 (檐椽 14 : 飞椽 7 = 2:1) ---
  D.rafterDia   = 1.5 * dk;                       // 椽径 = 1.5 斗口
  D.eaveRafter  = 14 * dk;
  D.flyRafter   = 7 * dk;
  D.eaveOut     = isDaShi ? (D.eaveRafter + D.flyRafter) : D.colH * 0.3;
  D.zhengXinHeng = 4.5 * dk;                      // 正心桁径
  D.tiaoYanHeng  = 3 * dk;                        // 挑檐桁径
  D.purlinDia    = D.rafterDia * 3;               // 檩径 = 3 椽径

  // --- 冲三翘四: corner rafter projects 3 椽径, rises 4 椽径 ---
  D.cornerOut  = 3 * D.rafterDia;
  D.cornerRise = 4 * D.rafterDia;

  // --- 生起: corner columns rise 2寸 per two bays (Song only) ---
  D.shengqi = isSong ? (bays - 1) * 0.5 * (2 / D.doukouCun) * dk : 0;

  // --- platform 台明 ---
  D.baseH = isDaShi ? D.colH * 0.2 : 2 * D.colDia;

  // --- bracket set 斗栱 ---
  D.dgUnit = dk;                                  // bracket sized on the module
  D.dgH    = isDaShi ? 12 * dk : 0;

  return D;
}


// ---------- legacy normalized profile (kept for the roof surface sampler) ----------
function solveRoofProfile(halfDepth, roofHeight, steps) {
  steps = steps || 5;
  var coeffs = [0.5, 0.62, 0.72, 0.82, 0.92].slice(0, steps);
  var stepRun = halfDepth / steps;
  var pts = [{x:0, y:0}];
  var cx = 0, cy = 0;
  for (var i = 0; i < steps; i++) {
    cx += stepRun; cy += coeffs[i] * stepRun;
    pts.push({x:cx, y:cy});
  }
  var maxY = pts[pts.length-1].y, maxX = pts[pts.length-1].x;
  return pts.map(function(p){
    return { x: halfDepth - (p.x/maxX)*halfDepth, y: (p.y/maxY)*roofHeight };
  }).reverse();
}

function profileH(t, profile, halfDepth) {
  var tx = Math.min(1, Math.max(0, t)) * halfDepth;
  for (var i = 0; i < profile.length-1; i++) {
    var a = profile[i], b = profile[i+1];
    if (tx >= a.x && tx <= b.x) {
      var f = (tx - a.x) / (b.x - a.x || 1);
      return a.y + (b.y - a.y) * f;
    }
  }
  return profile[profile.length-1].y;
}

function cornerLift(t, xf, zf, upturn) {
  return upturn * (xf * zf) * Math.max(0, (t - 0.5) / 0.5);
}

function makeSurface(o) {
  var geo = new THREE.BufferGeometry();
  var pos = [], idx = [], uvs = [];
  var nx = o.segX + 1, nz = o.segZ + 1;
  var thick = o.thickness || 0;

  for (var j = 0; j <= o.segZ; j++) {
    var v = j / o.segZ;
    var z = o.halfDepth - v * 2 * o.halfDepth;
    var t = Math.min(1, Math.abs(z) / o.halfDepth);
    var bx = o.boundary(t);
    for (var i = 0; i <= o.segX; i++) {
      var u = i / o.segX;
      var xr = -o.halfWidth + u * 2 * o.halfWidth;
      var x = Math.max(-bx, Math.min(bx, xr));
      pos.push(x, o.height(x, z, t, bx), z);
      uvs.push(u, v);
    }
  }
  var nVert = nx * nz;

  if (thick > 0) {
    for (var j2 = 0; j2 <= o.segZ; j2++) {
      for (var i2 = 0; i2 <= o.segX; i2++) {
        var base = (j2 * nx + i2) * 3;
        pos.push(pos[base], pos[base+1] - thick, pos[base+2]);
        uvs.push(i2/o.segX, j2/o.segZ);
      }
    }
  }

  for (var jj = 0; jj < o.segZ; jj++) {
    for (var ii = 0; ii < o.segX; ii++) {
      var a = jj*nx+ii, b = a+1, c = a+nx, d = c+1;
      idx.push(a, c, b, b, c, d);
      if (thick > 0) {
        var a2 = a+nVert, b2 = b+nVert, c2 = c+nVert, d2 = d+nVert;
        idx.push(a2, b2, c2, b2, d2, c2);
      }
    }
  }

  if (thick > 0) {
    // stitch the four border rims so the shell is closed
    for (var i3 = 0; i3 < o.segX; i3++) {
      var f0 = i3, f1 = i3+1;
      idx.push(f0, f1, f0+nVert, f1, f1+nVert, f0+nVert);
      var k0 = o.segZ*nx + i3, k1 = k0+1;
      idx.push(k1, k0, k0+nVert, k1, k0+nVert, k1+nVert);
    }
    for (var j3 = 0; j3 < o.segZ; j3++) {
      var l0 = j3*nx, l1 = l0+nx;
      idx.push(l1, l0, l0+nVert, l1, l0+nVert, l1+nVert);
      var r0 = j3*nx + o.segX, r1 = r0+nx;
      idx.push(r0, r1, r0+nVert, r1, r1+nVert, r0+nVert);
    }
  }

  geo.setIndex(idx);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.computeVertexNormals();
  return geo;
}

// tile corrugation: ribs run down the slope, so ripple varies across the slope
function tileRib(coord, ribCount, span, amp) {
  if (ribCount <= 0) return 0;
  var period = (2 * span) / ribCount;
  var phase = (coord / period) * Math.PI * 2;
  var c = 0.5 + 0.5 * Math.cos(phase);
  // sharpen: rounded pan tiles with a defined valley between each rib
  return amp * Math.pow(c, 0.4);
}

function ridgeBeam(len, thick, mat, ornament) {
  var g = new THREE.Group();
  var body = new THREE.Mesh(new THREE.BoxGeometry(len, thick*1.5, thick), mat);
  g.add(body);
  var cap = new THREE.Mesh(new THREE.BoxGeometry(len, thick*0.5, thick*1.5), mat);
  cap.position.y = thick*0.9;
  g.add(cap);
  if (ornament) {
    // 鸱吻 owl-tail finial: an S-curved silhouette extruded to give it real form
    var sh = new THREE.Shape();
    var u = thick;
    sh.moveTo(0, 0);
    sh.lineTo(u*1.5, 0);
    sh.quadraticCurveTo(u*2.3, u*1.1, u*1.75, u*2.2);
    sh.quadraticCurveTo(u*1.45, u*3.0, u*0.6, u*3.25);
    sh.quadraticCurveTo(u*1.15, u*2.35, u*0.85, u*1.75);
    sh.quadraticCurveTo(u*0.55, u*1.15, 0, u*1.0);
    sh.lineTo(0, 0);
    var eg = new THREE.ExtrudeGeometry(sh, { depth: u*0.95, bevelEnabled:true,
      bevelThickness: u*0.09, bevelSize: u*0.08, bevelSegments: 2, curveSegments: 10 });
    eg.translate(0, 0, -u*0.475);
    [-1, 1].forEach(function(sd){
      var o = new THREE.Mesh(eg, mat);
      if (sd < 0) o.rotation.y = Math.PI;   // rotate, never mirror: mirroring inverts normals
      o.position.set(sd * len/2, thick*0.35, 0);
      o.castShadow = true; o.receiveShadow = true;
      g.add(o);
    });
  }
  g.traverse(function(m){ if(m.isMesh){ m.castShadow = true; m.receiveShadow = true; } });
  return g;
}

// 垂脊/戗脊 hip ridges running down the diagonal hip lines
function hipRidges(cornerPts, apexY, mat, thick) {
  var g = new THREE.Group();
  cornerPts.forEach(function(c){
    var dir = new THREE.Vector3(c.x - c.ax, c.y - c.ay, c.z - c.az);
    var len = dir.length();
    if (len < 0.05) return;
    var box = new THREE.Mesh(new THREE.BoxGeometry(thick*1.15, thick*1.5, len), mat);
    var mid = new THREE.Vector3((c.x+c.ax)/2, (c.y+c.ay)/2 + thick*0.5, (c.z+c.az)/2);
    box.position.copy(mid);
    box.lookAt(new THREE.Vector3(c.x, c.y + thick*0.5, c.z));
    box.castShadow = true; box.receiveShadow = true;
    g.add(box);
  });
  return g;
}

// ---- eave assembly: 椽子 rafters, 飞椽 flying rafters, 瓦当 tile caps, pale trim band ----
function buildEaveAssembly(hw, hd, heightFn, rafterMat, trimMat, capMat, spacing) {
  var g = new THREE.Group();
  var samples = [];
  var stepsX = Math.max(6, Math.round((hw*2) / spacing));
  var stepsZ = Math.max(4, Math.round((hd*2) / spacing));

  function push(x, z, nx, nz) {
    samples.push({ x:x, z:z, nx:nx, nz:nz, y:heightFn(x, z) });
  }
  for (var i = 0; i <= stepsX; i++) { var x = -hw + (i/stepsX)*hw*2; push(x, hd, 0, 1); }
  for (var k = 1; k <= stepsZ; k++) { var z = hd - (k/stepsZ)*hd*2; push(hw, z, 1, 0); }
  for (var i2 = stepsX; i2 >= 0; i2--) { var x2 = -hw + (i2/stepsX)*hw*2; push(x2, -hd, 0, -1); }
  for (var k2 = 1; k2 < stepsZ; k2++) { var z2 = -hd + (k2/stepsZ)*hd*2; push(-hw, z2, -1, 0); }

  // pale trim band: a closed prism ring (4 verts per sample) so it is a solid,
  // not a double-sided sheet. A doubled-winding sheet is non-manifold.
  var pos = [], idx = [];
  var bandH = 0.105, bandT = 0.045;
  var N = samples.length;
  for (var s0 = 0; s0 < N; s0++) {
    var p0 = samples[s0];
    var ox = p0.nx * bandT, oz = p0.nz * bandT;
    var yT = p0.y + 0.010, yB = yT - bandH;
    pos.push(p0.x + ox, yT, p0.z + oz);   // outer top
    pos.push(p0.x + ox, yB, p0.z + oz);   // outer bottom
    pos.push(p0.x - ox, yB, p0.z - oz);   // inner bottom
    pos.push(p0.x - ox, yT, p0.z - oz);   // inner top
  }
  function quad(a,b,c,d){ idx.push(a,b,c, a,c,d); }
  for (var s1 = 0; s1 < N; s1++) {
    var A = s1*4, B = ((s1+1) % N)*4;
    quad(A+0, A+1, B+1, B+0);   // outer face
    quad(B+3, B+2, A+2, A+3);   // inner face
    quad(A+3, A+0, B+0, B+3);   // top
    quad(A+1, A+2, B+2, B+1);   // bottom
  }
  var bandGeo = new THREE.BufferGeometry();
  bandGeo.setIndex(idx);
  bandGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  bandGeo.computeVertexNormals();
  var band = new THREE.Mesh(bandGeo, trimMat);
  band.castShadow = true; band.receiveShadow = true;
  g.add(band);

  // rafters + flying rafters, instanced
  var rl = 0.30, rr = 0.042;
  var rafterGeo = new THREE.CylinderGeometry(rr, rr, rl, 8);
  rafterGeo.rotateX(Math.PI/2);
  var flyGeo = new THREE.BoxGeometry(rr*1.5, rr*1.5, rl*0.62);
  var capGeo = new THREE.CylinderGeometry(rr*1.15, rr*1.15, 0.03, 12);
  capGeo.rotateX(Math.PI/2);

  var n = samples.length;
  var rafters = new THREE.InstancedMesh(rafterGeo, rafterMat, n);
  var flyers  = new THREE.InstancedMesh(flyGeo, rafterMat, n);
  var caps    = new THREE.InstancedMesh(capGeo, capMat, n);
  var m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler();
  var up = new THREE.Vector3(0,1,0);

  for (var s2 = 0; s2 < n; s2++) {
    var p = samples[s2];
    var ang = Math.atan2(p.nx, p.nz);
    e.set(0.26, ang, 0, 'YXZ');
    q.setFromEuler(e);
    var sc = new THREE.Vector3(1,1,1);

    m4.compose(new THREE.Vector3(p.x - p.nx*rl*0.62, p.y - 0.038, p.z - p.nz*rl*0.62), q, sc);
    rafters.setMatrixAt(s2, m4);

    e.set(0.10, ang, 0, 'YXZ'); q.setFromEuler(e);
    m4.compose(new THREE.Vector3(p.x - p.nx*rl*0.22, p.y - 0.014, p.z - p.nz*rl*0.22), q, sc);
    flyers.setMatrixAt(s2, m4);

    e.set(0, ang, 0, 'YXZ'); q.setFromEuler(e);
    m4.compose(new THREE.Vector3(p.x - p.nx*0.015, p.y - 0.006, p.z - p.nz*0.015), q, sc);
    caps.setMatrixAt(s2, m4);
  }
  [rafters, flyers, caps].forEach(function(im){
    im.instanceMatrix.needsUpdate = true;
    im.castShadow = true; im.receiveShadow = true;
    g.add(im);
  });
  return g;
}

// The shell's own corrugation is the source of truth for tile spacing. The
// texture carries 8 barrels x 6 courses, so repeating it ribCount/8 across the
// surface lands every painted barrel exactly on a modelled rib -- and the two
// crests coincide, because both peak at the centre of the span. Leave the two
// counts unrelated (the old fixed 6 x 3) and they beat against each other into
// moire, which is what a tiled roof must never do.
function tileMatFor(mat, ribCount, courses) {
  if (!mat.map || ribCount <= 0) return mat;
  var m = mat.clone();
  m.map = mat.map.clone(); m.map.needsUpdate = true;
  m.map.repeat.set(ribCount / 8, courses / 6);
  if (mat.normalMap) {
    m.normalMap = mat.normalMap.clone(); m.normalMap.needsUpdate = true;
    m.normalMap.repeat.copy(m.map.repeat);
  }
  return m;
}

function buildRoof(P) {
  var group = new THREE.Group();
  var halfWidth = P.halfWidth, halfDepth = P.halfDepth;
  var profile = solveRoofProfile(halfDepth, P.roofHeight, 5);
  var mat = P.tileMat, wallMat = P.gableMat, trimMat = P.trimMat;
  var ribs = P.ribs, ribAmp = 0.075;
  var segX = ribs > 0 ? Math.max(60, ribs * 3) : 32;

  // a 筒瓦 is roughly 2.2 times longer than it is wide, so derive the course
  // count from the barrel width the rib count implies
  function coursesFor(ribCount, spanHalfW, slopeRun) {
    if (ribCount <= 0) return 6;
    return Math.max(4, Math.round(slopeRun / ((2 * spanHalfW / ribCount) * 2.2)));
  }
  // v runs across both slopes, so the run is the full depth, not the half
  var fullRun = 2 * Math.sqrt(halfDepth*halfDepth + P.roofHeight*P.roofHeight);

  if (P.roofType === 'wudian') {
    // 推山 (tuishan): each step above the eave step is reduced by 1/10 of its
    // own run, recursively -- this lengthens 正脊 beyond the naive 45-degree hip.
    var naiveRidge = Math.max(0.35, halfWidth - halfDepth);
    var ridgeHalfLen = naiveRidge;
    if (P.tuishan) {
      var steps = 4, run = halfDepth / steps, gained = 0, cur = run;
      for (var ts = 1; ts < steps; ts++) { cur = cur * 0.9; gained += (run - cur); }
      ridgeHalfLen = Math.min(halfWidth * 0.92, naiveRidge + gained);
    }
    var boundary = function(t){ return halfWidth; };
    var geo = makeSurface({
      segX: segX, segZ: 40, halfWidth: halfWidth, halfDepth: halfDepth,
      thickness: P.shellThick,
      boundary: boundary,
      height: function(x, z, t, bx) {
        var dz = Math.abs(z) / halfDepth;
        var dx = Math.max(0, Math.abs(x) - ridgeHalfLen) / Math.max(halfWidth - ridgeHalfLen, 1e-6);
        var hipDom = dx > dz;
        var tEff = Math.min(1, Math.max(dz, dx));
        var y = profileH(tEff, profile, halfDepth);
        y += cornerLift(tEff, Math.abs(x)/halfWidth, dz, P.upturn);
        y += tileRib(hipDom ? z : x, ribs, hipDom ? halfDepth : halfWidth, ribAmp);
        return y;
      }
    });
    var m = new THREE.Mesh(geo, tileMatFor(mat, ribs, coursesFor(ribs, halfWidth, fullRun)));
    m.castShadow = true; m.receiveShadow = true;
    group.add(m);
    var rb = ridgeBeam(ridgeHalfLen*2 + 0.2, 0.11, trimMat, true);
    var apexY = profileH(0, profile, halfDepth);
    rb.position.set(0, apexY + 0.09, 0);
    group.add(rb);
    var eaveY0 = profileH(1, profile, halfDepth);
    var cps = [];
    [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(function(s){
      cps.push({ ax: s[0]*ridgeHalfLen, ay: apexY, az: 0,
                 x: s[0]*halfWidth, y: eaveY0 + P.upturn, z: s[1]*halfDepth });
    });
    group.add(hipRidges(cps, apexY, trimMat, 0.1));
    group.add(buildEaveAssembly(halfWidth, halfDepth, function(x,z){
      var dz = Math.abs(z)/halfDepth;
      var dx = Math.max(0, Math.abs(x)-ridgeHalfLen)/Math.max(halfWidth-ridgeHalfLen,1e-6);
      var tE = Math.min(1, Math.max(dz,dx));
      return profileH(tE, profile, halfDepth) + cornerLift(tE, Math.abs(x)/halfWidth, dz, P.upturn) - P.shellThick;
    }, P.rafterMat, P.eaveTrimMat, P.capMat, 0.30));
    return group;
  }

  // ---- 歇山顶 xieshan ----
  // derive the gable break from the 收山 gable plane rather than a magic fraction
  var tBreak = P.purlinDia
    ? Math.min(0.78, Math.max(0.35, 1 - (halfDepth * 0.55 + P.purlinDia) / halfDepth))
    : 1 - P.gableFrac;
  // 收山 (shoushan): Qing recedes the gable plane one 檩径 from the side
  // purlin centreline, rather than an arbitrary fraction of the width.
  var gableHW = P.purlinDia
    ? Math.max(halfWidth * 0.22, halfWidth - halfDepth * 0.55 - P.purlinDia)
    : halfWidth * (0.30 + 0.25 * P.gableFrac);
  var skirtTopY = profileH(tBreak, profile, halfDepth);
  var gableWallH = 0.0;
  var ridgeY = profileH(0, profile, halfDepth);

  var lowerBoundary = function(t) { return halfWidth; };
  var lowerGeo = makeSurface({
    segX: segX, segZ: 44, halfWidth: halfWidth, halfDepth: halfDepth,
    thickness: P.shellThick,
    boundary: lowerBoundary,
    height: function(x, z, t, bx) {
      var gz = tBreak * halfDepth;
      var dx = Math.max(0, Math.abs(x) - gableHW) / Math.max(halfWidth - gableHW, 1e-6);
      var dz = Math.max(0, Math.abs(z) - gz) / Math.max(halfDepth - gz, 1e-6);
      if (dx <= 0 && dz <= 0) return skirtTopY;
      var hipDom = dx > dz;
      var f = Math.min(1, Math.max(dx, dz));
      var tEff = tBreak + f * (1 - tBreak);
      var y = profileH(tEff, profile, halfDepth);
      y += cornerLift(tEff, Math.abs(x)/halfWidth, Math.abs(z)/halfDepth, P.upturn);
      y += tileRib(hipDom ? z : x, ribs, hipDom ? halfDepth : halfWidth, ribAmp);
      return y;
    }
  });
  var lower = new THREE.Mesh(lowerGeo, tileMatFor(mat, ribs, coursesFor(ribs, halfWidth, fullRun)));
  lower.castShadow = true; lower.receiveShadow = true;
  group.add(lower);

  var upHD = tBreak * halfDepth * 1.10;
  var upHW = gableHW * 1.10;
  var upBase = skirtTopY - 0.05;
  var upperGeo = makeSurface({
    segX: Math.max(40, Math.round(ribs*1.6)), segZ: 30, halfWidth: upHW, halfDepth: upHD,
    thickness: P.shellThick,
    boundary: function(){ return upHW; },
    height: function(x, z, t, bx) {
      var tt = Math.min(1, Math.abs(z) / upHD);
      var span = ridgeY - skirtTopY;
      var y = upBase + span * (1 - Math.pow(tt, 1.35));
      y += cornerLift(tt, bx > 0 ? Math.abs(x)/bx : 0, tt, P.upturn * 0.5);
      y += tileRib(x, Math.round(ribs*0.55), upHW, ribAmp);
      return y;
    }
  });
  // the upper roof is modelled with 0.55 of the rib count over a shorter span
  var upRibs = Math.round(ribs * 0.55);
  var upper = new THREE.Mesh(upperGeo,
    tileMatFor(mat, upRibs, coursesFor(upRibs, upHW, 2 * (ridgeY - skirtTopY + upHD))));
  upper.castShadow = true; upper.receiveShadow = true;
  group.add(upper);

  // 山花 gable end walls
  [1, -1].forEach(function(side){
    var shape = new THREE.Shape();
    shape.moveTo(-upHD, 0);
    shape.lineTo(upHD, 0);
    shape.lineTo(0, (ridgeY - skirtTopY) + gableWallH);
    shape.lineTo(-upHD, 0);
    var gGeo = new THREE.ExtrudeGeometry(shape, { depth: 0.07, bevelEnabled: false });
    gGeo.translate(0, 0, -0.035);
    var gm = new THREE.Mesh(gGeo, wallMat);
    gm.rotation.y = side * Math.PI/2;
    gm.position.set(side * gableHW * 0.985, skirtTopY - 0.012, 0);
    gm.castShadow = true; gm.receiveShadow = true;
    group.add(gm);
  });

  // main ridge 正脊
  var rb2 = ridgeBeam(upHW*2 + 0.15, 0.1, trimMat, true);
  rb2.position.set(0, upBase + (ridgeY - skirtTopY) + 0.08, 0);
  group.add(rb2);

  // 戗脊 hip ridges on the lower skirt: gable corner -> eave corner
  var eaveY1 = profileH(1, profile, halfDepth);
  var scps = [];
  [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(function(s){
    scps.push({ ax: s[0]*gableHW, ay: skirtTopY, az: s[1]*upHD,
                x: s[0]*halfWidth, y: eaveY1 + P.upturn, z: s[1]*halfDepth });
  });
  group.add(hipRidges(scps, skirtTopY, trimMat, 0.09));

  // 垂脊 on the upper gabled roof, ridge end down to its own eave corners
  var upRidgeY = upBase + (ridgeY - skirtTopY);
  var ucps = [];
  [[1,1],[1,-1],[-1,1],[-1,-1]].forEach(function(s){
    ucps.push({ ax: s[0]*upHW, ay: upRidgeY, az: 0,
                x: s[0]*upHW, y: upBase + P.upturn*0.5, z: s[1]*upHD });
  });
  group.add(hipRidges(ucps, upRidgeY, trimMat, 0.075));

  group.add(buildEaveAssembly(halfWidth, halfDepth, function(x,z){
    var gz = tBreak * halfDepth;
    var dx = Math.max(0, Math.abs(x)-gableHW)/Math.max(halfWidth-gableHW,1e-6);
    var dz = Math.max(0, Math.abs(z)-gz)/Math.max(halfDepth-gz,1e-6);
    var f = Math.min(1, Math.max(dx,dz));
    var tE = tBreak + f*(1-tBreak);
    return profileH(tE, profile, halfDepth)
         + cornerLift(tE, Math.abs(x)/halfWidth, Math.abs(z)/halfDepth, P.upturn) - P.shellThick;
  }, P.rafterMat, P.eaveTrimMat, P.capMat, 0.30));

  group.add(buildEaveAssembly(upHW, upHD, function(x,z){
    var tt = Math.min(1, Math.abs(z)/upHD);
    var span = ridgeY - skirtTopY;
    return upBase + span*(1-Math.pow(tt,1.35))
         + cornerLift(tt, Math.abs(x)/upHW, tt, P.upturn*0.5) - P.shellThick;
  }, P.rafterMat, P.eaveTrimMat, P.capMat, 0.32));

  return group;
}


// ============================================================================
//  PAGODA (塔) — polygonal 攒尖顶 tier roofs + storey stacking
//  Taper per storey from 应县木塔 measured 面阔: 968/927/883/842/798 cm
//  -> ratios 0.958 / 0.953 / 0.954 / 0.948, mean ~= 0.953
// ============================================================================
var PAGODA_TAPER = 0.953;

function polyRadius(R, n, theta) {
  var sector = (Math.PI * 2) / n;
  var a = ((theta % sector) + sector) % sector - sector / 2;
  return R * Math.cos(Math.PI / n) / Math.cos(a);
}

function cornerProximity(n, theta) {
  var sector = (Math.PI * 2) / n;
  var a = ((theta % sector) + sector) % sector;
  var d = Math.min(a, sector - a) / (sector / 2);
  return 1 - d;
}

function profileFrac(u, profile) {
  var last = profile[profile.length-1];
  var span = profile[0].y - last.y || 1;
  var tx = u * (last.x - profile[0].x) + profile[0].x;
  for (var i = 0; i < profile.length-1; i++) {
    var a = profile[i], b = profile[i+1];
    if (tx >= a.x && tx <= b.x) {
      var f = (tx - a.x) / (b.x - a.x || 1);
      var y = a.y + (b.y - a.y) * f;
      return (profile[0].y - y) / span;
    }
  }
  return 1;
}

function buildPolygonRoof(R, n, rise, upturn, ribs, profile, mat, thickness) {
  var ribK = n * Math.max(3, Math.round((ribs||12) / 5));
  var segA = Math.max(n * 12, ribK * 3), segR = 14;
  var pos = [], idx = [], uvs = [];
  var nA = segA + 1;

  function hAt(u, theta) {
    var y = rise * (1 - profileFrac(u, profile));
    var cp = cornerProximity(n, theta);
    y += upturn * Math.pow(cp, 2.2) * Math.max(0, (u - 0.5) / 0.5);
    if (ribs > 0) {
      // tile rows radiate from the apex: one rib every few degrees, amplitude
      // scaled to the roof so it reads at any size
      var K = n * Math.max(3, Math.round(ribs / 5));
      var ribPhase = theta * K;
      y += R * 0.030 * Math.pow(0.5 + 0.5 * Math.cos(ribPhase), 0.45) * Math.min(1, u * 2.2);
    }
    return y;
  }

  for (var j = 0; j <= segR; j++) {
    var u = j / segR;
    for (var i = 0; i <= segA; i++) {
      var th = (i / segA) * Math.PI * 2;
      var rr = polyRadius(R, n, th) * u;
      pos.push(Math.cos(th) * rr, hAt(u, th), Math.sin(th) * rr);
      uvs.push(i / segA, u);
    }
  }
  var nVert = nA * (segR + 1);
  if (thickness > 0) {
    for (var j2 = 0; j2 <= segR; j2++)
      for (var i2 = 0; i2 <= segA; i2++) {
        var b = (j2 * nA + i2) * 3;
        pos.push(pos[b], pos[b+1] - thickness, pos[b+2]);
        uvs.push(i2 / segA, j2 / segR);
      }
  }
  for (var jj = 0; jj < segR; jj++)
    for (var ii = 0; ii < segA; ii++) {
      var a2 = jj*nA+ii, b2 = a2+1, c2 = a2+nA, d2 = c2+1;
      idx.push(a2, c2, b2, b2, c2, d2);
      if (thickness > 0) idx.push(a2+nVert, b2+nVert, c2+nVert, b2+nVert, d2+nVert, c2+nVert);
    }
  if (thickness > 0) {
    for (var e = 0; e < segA; e++) {
      var o0 = segR*nA + e, o1 = o0 + 1;
      idx.push(o0, o1, o0+nVert, o1, o1+nVert, o0+nVert);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setIndex(idx);
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.computeVertexNormals();
  var m = new THREE.Mesh(geo, mat);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

function buildPagodaStorey(R, n, height, colDia, colMat, wallMat, railMat, withBalcony) {
  var g = new THREE.Group();
  var colGeo = new THREE.CylinderGeometry(colDia*0.46, colDia*0.5, height, 12);
  for (var k = 0; k < n; k++) {
    var th = (k / n) * Math.PI * 2;
    var x = Math.cos(th) * R, z = Math.sin(th) * R;
    var c = new THREE.Mesh(colGeo, colMat);
    c.position.set(x, height/2, z);
    c.castShadow = true; c.receiveShadow = true;
    g.add(c);
    var th2 = ((k+1) / n) * Math.PI * 2;
    var x2 = Math.cos(th2) * R, z2 = Math.sin(th2) * R;
    var mx = (x+x2)/2, mz = (z+z2)/2;
    var len = Math.sqrt((x2-x)*(x2-x) + (z2-z)*(z2-z)) * 0.9;
    var panel = new THREE.Mesh(new THREE.BoxGeometry(len, height*0.995, colDia*0.35), wallMat);
    panel.position.set(mx, height*0.4975, mz);
    panel.lookAt(new THREE.Vector3(mx*2, height*0.4975, mz*2));
    panel.castShadow = true; panel.receiveShadow = true;
    g.add(panel);

    // 槅扇 lattice window on each face, so storeys are not blank slabs
    var fr = colDia * 0.16;
    var winW = len * 0.62, winH = height * 0.52, winY = height * 0.56;
    var lat = new THREE.Group();
    var outward = new THREE.Vector3(mx*2, winY, mz*2);
    [[0, winH/2],[0, -winH/2]].forEach(function(o){
      var hb = new THREE.Mesh(new THREE.BoxGeometry(winW, fr, fr*1.4), railMat);
      hb.position.set(0, o[1], 0); lat.add(hb);
    });
    [[-winW/2],[winW/2]].forEach(function(o){
      var vb = new THREE.Mesh(new THREE.BoxGeometry(fr, winH, fr*1.4), railMat);
      vb.position.set(o[0], 0, 0); lat.add(vb);
    });
    for (var gx = 1; gx < 4; gx++) {
      var vm = new THREE.Mesh(new THREE.BoxGeometry(fr*0.5, winH*0.94, fr), railMat);
      vm.position.set(-winW/2 + (winW/4)*gx, 0, fr*0.2); lat.add(vm);
    }
    for (var gy = 1; gy < 5; gy++) {
      var hm = new THREE.Mesh(new THREE.BoxGeometry(winW*0.94, fr*0.5, fr), railMat);
      hm.position.set(0, -winH/2 + (winH/5)*gy, fr*0.2); lat.add(hm);
    }
    lat.position.set(mx*1.005, winY, mz*1.005);
    lat.lookAt(outward);
    lat.traverse(function(m){ if(m.isMesh){ m.castShadow = true; m.receiveShadow = true; } });
    g.add(lat);
    // 額枋 head beam closing the top of each bay against the roof above
    var beam = new THREE.Mesh(new THREE.BoxGeometry(len*1.04, colDia*0.75, colDia*0.55), colMat);
    beam.position.set(mx, height - colDia*0.42, mz);
    beam.lookAt(new THREE.Vector3(mx*2, height - colDia*0.42, mz*2));
    beam.castShadow = true; beam.receiveShadow = true;
    g.add(beam);
    // 腰檐 sill band at the foot of each storey
    var sill = new THREE.Mesh(new THREE.BoxGeometry(len*1.04, colDia*0.5, colDia*0.6), colMat);
    sill.position.set(mx, colDia*0.3, mz);
    sill.lookAt(new THREE.Vector3(mx*2, colDia*0.3, mz*2));
    sill.castShadow = true; sill.receiveShadow = true;
    g.add(sill);
  }
  if (withBalcony) {
    var rr = R * 1.06, postH = height * 0.155;
    var postGeo = new THREE.BoxGeometry(colDia*0.72, postH, colDia*0.72);
    var steps = n * 2;
    for (var q = 0; q < steps; q++) {
      var th3 = (q / steps) * Math.PI * 2;
      var pr = polyRadius(rr, n, th3);
      var pst = new THREE.Mesh(postGeo, railMat);
      pst.position.set(Math.cos(th3)*pr, postH/2, Math.sin(th3)*pr);
      pst.rotation.y = -th3;
      pst.castShadow = true;
      g.add(pst);
    }
    // handrail + mid rail, plus a solid skirt board along the balcony edge
    [[postH*0.98, colDia*0.55], [postH*0.52, colDia*0.34], [postH*0.10, colDia*0.9]].forEach(function(cfg){
      for (var e2 = 0; e2 < n; e2++) {
        var a1 = (e2/n)*Math.PI*2, a2b = ((e2+1)/n)*Math.PI*2;
        var p1 = new THREE.Vector3(Math.cos(a1)*rr, cfg[0], Math.sin(a1)*rr);
        var p2 = new THREE.Vector3(Math.cos(a2b)*rr, cfg[0], Math.sin(a2b)*rr);
        var seg = new THREE.Mesh(
          new THREE.BoxGeometry(p1.distanceTo(p2)*1.02, cfg[1], colDia*0.42), railMat);
        seg.position.copy(p1).add(p2).multiplyScalar(0.5);
        seg.lookAt(p2); seg.rotateY(Math.PI/2);
        seg.castShadow = true; seg.receiveShadow = true;
        g.add(seg);
      }
    });
  }
  return g;
}

function buildFinial(R, height, mat, goldMat) {
  var g = new THREE.Group();
  var mast = new THREE.Mesh(new THREE.CylinderGeometry(R*0.06, R*0.08, height, 12), mat);
  mast.position.y = height/2;
  g.add(mast);
  var rings = 7;
  for (var i = 0; i < rings; i++) {
    var f = i / rings;
    var rad = R * 0.30 * (1 - f * 0.62);
    var d = new THREE.Mesh(new THREE.TorusGeometry(Math.max(0.01, rad), Math.max(0.005, R*0.035), 8, 20), goldMat);
    d.rotation.x = Math.PI/2;
    d.position.y = height * (0.22 + f * 0.55);
    g.add(d);
  }
  var bead = new THREE.Mesh(new THREE.SphereGeometry(Math.max(0.01, R*0.10), 16, 12), goldMat);
  bead.position.y = height * 0.94;
  g.add(bead);
  g.traverse(function(m){ if(m.isMesh){ m.castShadow = true; m.receiveShadow = true; } });
  return g;
}

function buildPagoda(D, scale, opts, mats) {
  var g = new THREE.Group();
  var n = opts.sides, storeys = opts.storeys;
  var dense = opts.style === 'miyan';
  // 密檐式 towers are markedly more slender than 楼阁式, with one tall base
  // storey then thin stacked eaves (嵩岳寺塔 ~40 m on a ~10 m base = 4:1).
  var R0 = (D.totalWidth * scale) / 2 * (dense ? 0.30 : 1.0);
  var storeyH = D.colH * scale * (dense ? 0.55 : 1.0);
  var profile = solveRoofProfile(Math.max(0.001, D.halfDepth * scale), 1.0, 5);
  var eaveOut = D.eaveOut * scale * (dense ? 0.5 : 1.0);
  var thick = Math.max(0.03, D.purlinDia * scale * 0.5);

  var y = 0, R = R0;
  for (var i = 0; i < storeys; i++) {
    var isFirst = (i === 0);
    var h = dense ? (isFirst ? storeyH * 5.0 : storeyH * 0.34) : storeyH;

    var body = buildPagodaStorey(R, n, h, D.colDia * scale,
      mats.wood, mats.wall, mats.dg, !dense && !isFirst);
    body.position.y = y;
    g.add(body);

    if (opts.dougong) {
      var unit = D.colDia * scale * 0.22;
      for (var k = 0; k < n * 3; k++) {
        var th = (k / (n*3)) * Math.PI * 2;
        var pr = polyRadius(R, n, th);
        var blk = new THREE.Mesh(new THREE.BoxGeometry(unit*1.6, unit*1.5, unit*1.6), mats.dg);
        blk.position.set(Math.cos(th)*pr, y + h + unit*0.7, Math.sin(th)*pr);
        blk.rotation.y = -th;
        blk.castShadow = true;
        g.add(blk);
      }
    }

    var tierRise = (dense ? 0.42 : 0.78) * storeyH;
    var roofY = y + h + (opts.dougong ? D.colDia*scale*0.4 : 0) - thick*0.5;
    var roof = buildPolygonRoof(R + eaveOut, n, tierRise,
      D.cornerRise * scale, opts.ribs, profile, mats.tile, thick);
    roof.position.y = roofY;
    g.add(roof);

    // pale eave band around each tier edge
    var er = R + eaveOut;
    for (var eb = 0; eb < n; eb++) {
      var b1 = (eb/n)*Math.PI*2, b2 = ((eb+1)/n)*Math.PI*2;
      var q1 = new THREE.Vector3(Math.cos(b1)*er, 0, Math.sin(b1)*er);
      var q2 = new THREE.Vector3(Math.cos(b2)*er, 0, Math.sin(b2)*er);
      var band = new THREE.Mesh(
        new THREE.BoxGeometry(q1.distanceTo(q2)*1.02, thick*1.9, thick*1.5), mats.trim);
      band.position.copy(q1).add(q2).multiplyScalar(0.5);
      band.position.y = roofY - thick*0.6;
      band.lookAt(new THREE.Vector3(q2.x, roofY - thick*0.6, q2.z));
      band.rotateY(Math.PI/2);
      band.castShadow = true; band.receiveShadow = true;
      g.add(band);
    }

    y += h + tierRise * (dense ? 0.70 : 0.62);
    R *= dense ? 0.982 : PAGODA_TAPER;   // dense-eave towers taper far more slowly
  }

  var capRise = storeyH * 1.05;
  var cap = buildPolygonRoof(R + eaveOut*0.7, n, capRise,
    D.cornerRise * scale * 0.8, opts.ribs, profile, mats.tile, thick);
  cap.position.y = y;
  g.add(cap);

  var fin = buildFinial(R, storeyH * 1.25, mats.trim, mats.gold);
  fin.position.y = y + capRise;
  g.add(fin);

  g.userData.totalHeight = y + capRise + storeyH * 1.25;
  return g;
}

function buildBase(hw, hd, h, tiers, mat, trimMat) {
  var g = new THREE.Group();
  for (var i = 0; i < tiers; i++) {
    var shrink = i * 0.22;
    var w = (hw + 0.65) - shrink, d = (hd + 0.65) - shrink;
    var th = h / tiers;
    var m = new THREE.Mesh(new THREE.BoxGeometry(w*2, th*0.82, d*2), mat);
    m.position.y = i*th + th*0.41;
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
    // moulding cap for each tier (须弥座 profile hint)
    var cap = new THREE.Mesh(new THREE.BoxGeometry(w*2 + 0.12, th*0.18, d*2 + 0.12), trimMat);
    cap.position.y = i*th + th*0.91;
    cap.castShadow = true; cap.receiveShadow = true;
    g.add(cap);
    // the last tier wins: this is the surface the columns and balustrade sit on
    g.userData.topHW = w; g.userData.topHD = d;
  }
  return g;
}

// Column centrelines from the real 斗口 bay widths. Everything that has to line
// up with a bay -- columns, 槅扇, 斗栱 -- must read its positions from here.
function bayAxes(D, scale) {
  var xs = [-(D.totalWidth * scale) / 2], acc = xs[0];
  for (var i = 0; i < D.bayWidths.length; i++) { acc += D.bayWidths[i] * scale; xs.push(acc); }
  return xs;
}

function buildColumns(D, scale, baseH, mat, beamMat, plinthMat, useShengqi, useCejiao) {
  var g = new THREE.Group();
  var colH = D.colH * scale, r = (D.colDia * scale) / 2;
  var topR = (D.colTopDia * scale) / 2;                       // 收分 entasis
  var hw = (D.totalWidth * scale) / 2, hd = (D.totalDepth * scale) / 2;

  var xs = bayAxes(D, scale);

  // depth positions from the 步架 step runs
  var zs = [-hd], zacc = -hd;
  for (var k = D.stepRuns.length - 1; k >= 0; k--) { zacc += D.stepRuns[k] * scale; zs.push(zacc); }
  for (var k2 = 0; k2 < D.stepRuns.length; k2++) { zacc += D.stepRuns[k2] * scale; zs.push(zacc); }

  var mid = (xs.length - 1) / 2;
  xs.forEach(function(x, xi) {
    zs.forEach(function(z, zi) {
      var edge = (xi === 0 || xi === xs.length-1 || zi === 0 || zi === zs.length-1);
      if (!edge) return;

      // 生起: columns rise progressively toward the corners
      var rise = useShengqi ? D.shengqi * scale * (Math.abs(xi - mid) / Math.max(mid,1)) : 0;
      var h = colH + rise;

      var geo = new THREE.CylinderGeometry(topR, r, h, 14);
      var m = new THREE.Mesh(geo, mat);
      m.position.set(x, baseH + h/2, z);

      // 侧脚: columns lean inward, 1/100 front-back and 8/1000 side
      if (useCejiao) {
        m.rotation.z =  (x > 0 ? -1 : 1) * D.cejiao.side  * (Math.abs(x) > 1e-6 ? 1 : 0);
        m.rotation.x =  (z > 0 ?  1 : -1) * D.cejiao.front * (Math.abs(z) > 1e-6 ? 1 : 0);
      }
      m.castShadow = true; m.receiveShadow = true;
      g.add(m);

      var pl = new THREE.Mesh(new THREE.CylinderGeometry(r*1.75, r*1.95, r*1.1, 16), plinthMat);
      pl.position.set(x, baseH + r*0.55, z);
      pl.castShadow = true; pl.receiveShadow = true;
      g.add(pl);
    });
  });

  // 额枋 head tie-beams, sized on the module (10:8 section)
  var bh = D.colDia * scale * 0.8, bt = bh * 0.8;
  var yTop = baseH + colH - bh*0.7;
  [zs[0], zs[zs.length-1]].forEach(function(z){
    var b = new THREE.Mesh(new THREE.BoxGeometry(hw*2, bh, bt), beamMat);
    b.position.set(0, yTop, z); b.castShadow = true; g.add(b);
  });
  [xs[0], xs[xs.length-1]].forEach(function(x){
    var b = new THREE.Mesh(new THREE.BoxGeometry(bt, bh, hd*2), beamMat);
    b.position.set(x, yTop, 0); b.castShadow = true; g.add(b);
  });
  g.userData.xs = xs; g.userData.zs = zs;
  return g;
}

// 斗栱 bracket band under the eave. Every dimension is cut from 斗口 (dk), which
// is what makes the arms clear each other: the longest is 9.4 斗口 inside a 攒当
// of 11. Sizing them off an arbitrary unit is what turns the band into mush.
function buildDougong(hw, hd, y, mat, dk) {
  var g = new THREE.Group();
  var u = dk || 0.026;
  var spacing = 11 * u;                                   // 攒当
  var tiers = 3, tierH = 3.6 * u;                         // 12 斗口 total, per 大式
  var seatGeo = new THREE.BoxGeometry(3.2*u, 2*u, 3.2*u); // 坐斗
  var capGeo  = new THREE.BoxGeometry(1.8*u, 1.0*u, 1.8*u); // 升
  var armX = [], armZ = [], armLen = [];
  for (var t = 0; t < tiers; t++) {
    armLen.push((6.2 + t * 1.6) * u);                     // 瓜栱 → 万栱 → 厢栱
    armX.push(new THREE.BoxGeometry(armLen[t], 1.4*u, 1.25*u));
    armZ.push(new THREE.BoxGeometry(1.25*u, 1.4*u, armLen[t]));
  }

  function bracketAt(x, z, rotY) {
    var b = new THREE.Group();
    var seat = new THREE.Mesh(seatGeo, mat);
    seat.position.y = u;
    b.add(seat);
    for (var t = 0; t < tiers; t++) {
      var yt = 2*u + t * tierH;
      var arm = new THREE.Mesh(rotY ? armZ[t] : armX[t], mat);
      arm.position.y = yt + 0.7*u;
      b.add(arm);
      var reach = armLen[t] / 2 - 0.9*u;
      [-reach, 0, reach].forEach(function(o){
        var c = new THREE.Mesh(capGeo, mat);
        c.position.set(rotY ? 0 : o, yt + 1.9*u, rotY ? o : 0);
        b.add(c);
      });
    }
    b.position.set(x, y, z);
    b.traverse(function(m){ if(m.isMesh){ m.castShadow = true; } });
    return b;
  }

  g.userData.height = 2*u + (tiers - 1) * tierH + 2.4*u;

  // 垫栱板: the boards closing the space between bracket sets. Leave them out
  // and the band is a row of holes you can see the sky through.
  var bandH = g.userData.height;
  var boardX = new THREE.BoxGeometry(hw*2, bandH, 1.2*u);
  var boardZ = new THREE.BoxGeometry(1.2*u, bandH, hd*2);
  [hd, -hd].forEach(function(bz){
    var m = new THREE.Mesh(boardX, mat);
    m.position.set(0, y + bandH/2, bz);
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
  });
  [hw, -hw].forEach(function(bx){
    var m = new THREE.Mesh(boardZ, mat);
    m.position.set(bx, y + bandH/2, 0);
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
  });

  // one bracket per 攒当, so the 柱头科 land on the column centrelines
  var nx = Math.max(2, Math.round((hw*2) / spacing));
  var nz = Math.max(2, Math.round((hd*2) / spacing));
  for (var i = 0; i <= nx; i++) {
    var bx = -hw + (i/nx) * hw*2;
    g.add(bracketAt(bx, hd, false));
    g.add(bracketAt(bx, -hd, false));
  }
  for (var k = 1; k < nz; k++) {
    var bz = -hd + (k/nz) * hd*2;
    g.add(bracketAt(hw, bz, true));
    g.add(bracketAt(-hw, bz, true));
  }
  return g;
}

function buildWalls(hw, hd, baseH, colH, mat, colR) {
  var g = new THREE.Group();
  // sit flush against the column centreline so no gap opens between wall and column,
  // and run right up to the underside of the 额枋 (which buildColumns puts at
  // colH - 1.2 * beam height, beam height being 0.8 * column diameter)
  var r = colR || 0.08;
  var wh = colH - r * 1.92, t = 0.09, inset = r * 0.5;
  var back = new THREE.Mesh(new THREE.BoxGeometry((hw-inset)*2, wh, t), mat);
  back.position.set(0, baseH + wh/2, -(hd-inset));
  g.add(back);
  [-1, 1].forEach(function(s){
    var side = new THREE.Mesh(new THREE.BoxGeometry(t, wh, (hd-inset)*2), mat);
    side.position.set(s*(hw-inset), baseH + wh/2, 0);
    g.add(side);
  });
  g.traverse(function(m){ if(m.isMesh){ m.castShadow = true; m.receiveShadow = true; } });
  return g;
}

// 槅扇 door/window screens: one set per structural bay, filling the clear opening
// between that bay's two columns. Bay widths are unequal (77 斗口 at the 明间,
// -11 per bay outward), so the layout has to come off bayAxes, never off an even
// division of the facade.
function buildLattice(D, scale, hd, baseH, colH, frameMat, paperMat, colR) {
  var g = new THREE.Group();
  var xs = bayAxes(D, scale);
  var bays = xs.length - 1;
  var r = colR || 0.08;
  var z = hd - r * 0.5;                       // set behind the column centreline
  var y0 = baseH;
  var top = y0 + colH - r * 1.92;             // underside of the 额枋
  var fr = 0.035;
  var leafTarget = colH * 0.22;               // nominal 槅扇 leaf width
  var cellTarget = colH * 0.075;              // nominal lattice cell, kept constant
  var centre = (bays - 1) / 2;

  for (var b = 0; b < bays; b++) {
    // clear opening: column face to column face
    var x0 = xs[b] + r, x1 = xs[b + 1] - r, cx = (x0 + x1) / 2;
    var clear = x1 - x0;
    if (clear < fr * 6) continue;

    // even leaf count so the meeting stile lands on the bay centreline
    var leaves = Math.max(2, 2 * Math.round(clear / leafTarget / 2));
    var leafW = clear / leaves;

    // 明间 (and its neighbours on a wide hall) are doors; the rest are 槛窗
    var isDoor = Math.abs(b - centre) <= (bays >= 7 ? 1 : 0);
    var bot = y0 + (top - y0) * (isDoor ? 0.0 : 0.34);
    var paneH = top - bot;

    // 槛墙 low wall carrying the window bays
    if (!isDoor) {
      var sill = new THREE.Mesh(new THREE.BoxGeometry(clear, bot - y0, fr * 2.6), frameMat);
      sill.position.set(cx, (y0 + bot) / 2, z);
      sill.receiveShadow = true;
      g.add(sill);
    }

    // 裙板 skirt fills the bottom third of a door leaf; a window is glazed throughout
    var gridBot = bot + paneH * (isDoor ? 0.36 : 0.10);
    var gridTop = top - paneH * 0.10;
    var cols = Math.max(2, Math.round(leafW / cellTarget));
    var cell = leafW / cols;
    var rows = Math.max(2, Math.round((gridTop - gridBot) / cell));

    for (var L = 0; L < leaves; L++) {
      var lx = x0 + leafW * (L + 0.5);

      var back = new THREE.Mesh(new THREE.BoxGeometry(leafW, paneH, 0.02), paperMat);
      back.position.set(lx, (bot + top) / 2, z);
      g.add(back);

      if (isDoor) {
        var skirt = new THREE.Mesh(
          new THREE.BoxGeometry(leafW, gridBot - bot, fr * 2.4), frameMat);
        skirt.position.set(lx, (bot + gridBot) / 2, z + 0.004);
        g.add(skirt);
      }

      // muntins sized off cellTarget so the cells stay square and the same size
      // in every bay, however wide that bay's leaves came out
      for (var c = 1; c < cols; c++) {
        var vm = new THREE.Mesh(
          new THREE.BoxGeometry(fr * 0.75, gridTop - gridBot, fr * 1.5), frameMat);
        vm.position.set(lx - leafW / 2 + cell * c, (gridTop + gridBot) / 2, z + 0.006);
        g.add(vm);
      }
      for (var rr = 1; rr < rows; rr++) {
        var hm = new THREE.Mesh(new THREE.BoxGeometry(leafW, fr * 0.75, fr * 1.5), frameMat);
        hm.position.set(lx, gridBot + ((gridTop - gridBot) / rows) * rr, z + 0.006);
        g.add(hm);
      }
    }

    // 边梃 stile on every leaf edge, the middle one doubled as the meeting stile
    for (var s = 0; s <= leaves; s++) {
      var st = new THREE.Mesh(
        new THREE.BoxGeometry(fr * (s === leaves / 2 ? 2.0 : 1.6), paneH, fr * 2.4), frameMat);
      st.position.set(x0 + leafW * s, (bot + top) / 2, z + 0.008);
      g.add(st);
    }
    // 抹头 rails run the full opening
    [bot, gridBot, gridTop, top].forEach(function(ry){
      var rl = new THREE.Mesh(new THREE.BoxGeometry(clear, fr * 1.6, fr * 2.2), frameMat);
      rl.position.set(cx, ry, z + 0.007);
      g.add(rl);
    });
  }

  g.traverse(function(m){ if(m.isMesh){ m.castShadow = true; m.receiveShadow = true; } });
  return g;
}

// 踏跺 front steps
function buildSteps(halfW, baseH, tiers, mat, cheekMat) {
  var g = new THREE.Group();
  var n = Math.max(3, Math.round(baseH / 0.15));
  var w = halfW;
  var depthEach = 0.24;
  var runTotal = depthEach * n;
  for (var i = 0; i < n; i++) {
    var h = baseH * ((i+1)/n);
    var st = new THREE.Mesh(new THREE.BoxGeometry(w*2, h, depthEach), mat);
    st.position.set(0, h/2, depthEach * (n - i - 0.5));
    st.castShadow = true; st.receiveShadow = true;
    g.add(st);
  }
  // 垂带 sloping side cheeks flanking the flight
  var shape = new THREE.Shape();
  shape.moveTo(0, 0);
  shape.lineTo(runTotal, 0);
  shape.lineTo(runTotal, baseH * 0.30);
  shape.lineTo(0, baseH * 1.04);
  shape.lineTo(0, 0);
  var eg = new THREE.ExtrudeGeometry(shape, { depth: 0.16, bevelEnabled:false });
  [-1, 1].forEach(function(sd){
    var ch = new THREE.Mesh(eg, cheekMat);
    // extrude runs along local +X; -90 deg about Y sends it to world +Z, out in
    // front with the flight. +90 sends it to -Z, i.e. buried in the platform.
    ch.rotation.y = -Math.PI/2;
    // the 0.16 of extrude depth lands on -X of the origin, so shift it back
    ch.position.set(sd * (w + 0.08) + 0.08, 0, 0);
    ch.castShadow = true; ch.receiveShadow = true;
    g.add(ch);
  });
  return g;
}
